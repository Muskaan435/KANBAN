<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav>
            <div class="left">Kanban</div>
            <div class="right"><button id="toggle-modal">Add new Task</button></div>
        </nav>
        <section class="board">
            <!-- blue -->
            <div id="todo" class="task-column">
                <div class="headding">
                    <div class="left">To Do</div>
                    <div class="right">count</div>
                </div>
                <div draggable="true" class="task">
                    <div class="task-title">
                        <h2>task 1</h2>
                        <p>Description for Task 1</p>
                        <button id="delete-button">Delete</button>
                    </div>
                </div>
            </div>
            <!-- yellow -->
            <div id="progress" class="task-column">
                <div class="headding">
                    <div class="left">In Process</div>
                    <div class="right">count</div>
                </div>
            </div>
            <!-- Green -->
            <div id="done" class="task-column">
                <div class="headding">
                    <div class="left">Done</div>
                    <div class="right">count</div>
                </div>
            </div>
        </section>
    </main>

    <div class="modal add-new-task">
        <div class="bg"></div>
        <div class="center">
            <input type="text" name="" id="task-title-input" placeholder="Task-title">
            <textarea name="" placeholder="Task Description" id="task-description-input"></textarea>
            <button class="add-task-button" id="add-new-button">Add Task</button>
        </div>        
    </div>
    
    <script src="script.js"></script>
</body>
</html>
