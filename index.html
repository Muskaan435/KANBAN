<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <nav>
            <div class="left">Kanban</div>
            <div class="right"><button>Add new Task</button></div>
        </nav>
        <section class="board">
            <div class="task-column">
                <div class="headding">
                    <div class="left">To Do</div>
                    <div class="right">count</div>
                </div>
                <div draggable="true" class="task">
                    <div class="task-title">
                        <h2>task 1</h2>
                        <p>Description for Task 1</p>
                        <button>Delete</button>
                    </div>
                </div>
            </div>
            <div class="task-column">
                <div class="headding">
                    <div class="left">In Process</div>
                    <div class="right">count</div>
                </div>
            </div>
            <div class="task-column">
                <div class="headding">
                    <div class="left">Done</div>
                    <div class="right">count</div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
